version: '3.8'

services:
  php-fpm:
    build: ./php
    container_name: photography-php
    volumes:
      - ../:/var/www/html
    networks:
      - photography-network

  nginx:
    image: nginx:alpine
    container_name: photography-nginx
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      - photography-network

networks:
  photography-network:
    driver: bridge
